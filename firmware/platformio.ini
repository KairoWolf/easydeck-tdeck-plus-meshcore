; EasyDeck — a simple, friendly MeshCore firmware for the LilyGO T-Deck Plus.
;
; MeshCore (MIT) is pulled in unmodified as a git submodule in lib/MeshCore and
; compiled as a library through its own build_as_lib.py. We reuse its stock
; companion_radio example (MyMesh + DataStore) so the official MeshCore apps keep
; working, and replace the UI and main.cpp with our own.

[platformio]
default_envs = tdeck_plus

[env:tdeck_plus]
platform = platformio/espressif32@6.11.0
framework = arduino
board = t-deck
board_build.partitions = partitions.csv
board_build.filesystem = spiffs
lib_extra_dirs = lib/MeshCore/lib
lib_ldf_mode = chain+
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
extra_scripts = post:scripts/dist.py
custom_version = 0.50.1

build_flags =
  -w -DNDEBUG
  -std=gnu++17
  -I src
  -I include
  -I lib/MeshCore/examples/companion_radio
  -I lib/MeshCore/lib/ed25519
  ; ---- MeshCore library build selection (consumed by lib/MeshCore/build_as_lib.py; order matters) ----
  -D BUILD_EXAMPLE=companion_radio
  -D EXCLUDE_FROM_EXAMPLE=main.cpp
  ; ---- MeshCore core config (mirrors upstream arduino_base / esp32_base) ----
  -D RADIOLIB_STATIC_ONLY=1 -D RADIOLIB_GODMODE=1
  -D RADIOLIB_EXCLUDE_CC1101=1 -D RADIOLIB_EXCLUDE_RF69=1 -D RADIOLIB_EXCLUDE_SX1231=1
  -D RADIOLIB_EXCLUDE_SI443X=1 -D RADIOLIB_EXCLUDE_RFM2X=1 -D RADIOLIB_EXCLUDE_SX128X=1
  -D RADIOLIB_EXCLUDE_AFSK=1 -D RADIOLIB_EXCLUDE_AX25=1 -D RADIOLIB_EXCLUDE_HELLSCHREIBER=1
  -D RADIOLIB_EXCLUDE_MORSE=1 -D RADIOLIB_EXCLUDE_APRS=1 -D RADIOLIB_EXCLUDE_BELL=1
  -D RADIOLIB_EXCLUDE_RTTY=1 -D RADIOLIB_EXCLUDE_SSTV=1
  -D ESP32_PLATFORM
  -D ENABLE_ADVERT_ON_BOOT=1
  -D ENABLE_PRIVATE_KEY_IMPORT=1
  -D ENABLE_PRIVATE_KEY_EXPORT=1
  ; Default radio: Australia (Mid) — NSW / MidCoast. The setup wizard lets users pick another preset.
  -D LORA_FREQ=915.075
  -D LORA_BW=125
  -D LORA_SF=9
  -D LORA_CR=5
  ; ---- Board ----
  -D LILYGO_TDECK
  -D EASYDECK
  -D BOARD_HAS_PSRAM=1
  -D CORE_DEBUG_LEVEL=1
  -D ARDUINO_USB_CDC_ON_BOOT=1
  -D PIN_USER_BTN=0
  -D PIN_PERF_POWERON=10
  -D PIN_BOARD_SDA=18
  -D PIN_BOARD_SCL=8
  -D USE_SX1262
  -D RADIO_CLASS=CustomSX1262
  -D WRAPPER_CLASS=CustomSX1262Wrapper
  -D LORA_TX_POWER=22
  -D SX126X_DIO2_AS_RF_SWITCH=true   ; LilyGO + Meshtastic enable it; harmless if the module doesn't use DIO2
  -D SX126X_CURRENT_LIMIT=140
  -D SX126X_RX_BOOSTED_GAIN=1
  -D SX126X_DIO3_TCXO_VOLTAGE=1.8f
  -D P_LORA_DIO_1=45
  -D P_LORA_NSS=9
  -D P_LORA_RESET=17
  -D P_LORA_BUSY=13
  -D P_LORA_SCLK=40
  -D P_LORA_MISO=38
  -D P_LORA_MOSI=41
  -D ENV_INCLUDE_GPS=1
  -D ENV_INCLUDE_AHTX0=0 -D ENV_INCLUDE_BME280=0 -D ENV_INCLUDE_BMP280=0
  -D ENV_INCLUDE_SHTC3=0 -D ENV_INCLUDE_SHT4X=0 -D ENV_INCLUDE_LPS22HB=0
  -D ENV_INCLUDE_INA3221=0 -D ENV_INCLUDE_INA219=0 -D ENV_INCLUDE_INA226=0
  -D ENV_INCLUDE_INA260=0 -D ENV_INCLUDE_MLX90614=0 -D ENV_INCLUDE_VL53L0X=0
  ; (ENV_INCLUDE_BME680 / ENV_INCLUDE_BMP085 are tested with #ifdef upstream: leave undefined)
  -D PIN_GPS_RX=43   ; MeshCore names GPS pins from the GPS side: Serial1.setPins(PIN_GPS_TX, PIN_GPS_RX)
  -D PIN_GPS_TX=44
  -D GPS_BAUD_RATE=38400
  ; ---- Companion app (Bluetooth) ----
  -D BLE_PIN_CODE=123456
  -D BLE_NAME_PREFIX='"EasyDeck-"'
  -D MAX_CONTACTS=350
  -D MAX_GROUP_CHANNELS=40
  -D OFFLINE_QUEUE_SIZE=128
  ; ---- GUI ----
  -D LV_CONF_INCLUDE_SIMPLE
  -D LV_LVGL_H_INCLUDE_SIMPLE

lib_deps =
  SPI
  Wire
  https://github.com/jgromes/RadioLib.git#6d8934836678d8894e3d556550475b37dce3e2b6
  rweather/Crypto @ ^0.4.0
  adafruit/RTClib @ ^2.1.3
  melopero/Melopero RV3028 @ ^1.1.0
  electroniccats/CayenneLPP @ 1.6.1
  stevemarple/MicroNMEA @ ^2.0.6
  densaugeo/base64 @ ~1.4.0
  lvgl/lvgl @ 9.2.2
  lovyan03/LovyanGFX @ 1.2.7
  ed25519
